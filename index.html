<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLC 업무 현황판</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px;
      color: #2d3748;
    }

    /* 헤더 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 1.6rem; font-weight: 700; color: #1a202c; }
    .header .subtitle { font-size: 0.85rem; color: #718096; margin-top: 2px; }
    .last-updated { font-size: 0.8rem; color: #a0aec0; text-align: right; }

    /* 그리드 */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    /* 카드 */
    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #718096;
      margin-bottom: 16px;
    }

    /* 최우선 목표 */
    .goal-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 24px 28px;
      color: white;
      box-shadow: 0 4px 20px rgba(102,126,234,0.3);
    }
    .goal-label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      opacity: 0.8;
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .goal-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
    }
    .goal-item:last-child { margin-bottom: 0; }
    .goal-num { font-size: 0.8rem; opacity: 0.65; font-weight: 600; flex-shrink: 0; }
    .goal-text { font-size: 1.05rem; font-weight: 700; }
    .goal-empty { font-size: 0.95rem; opacity: 0.5; font-style: italic; }

    /* 전체 현황 요약 */
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; height: 100%; }
    .summary-item {
      text-align: center;
      padding: 16px 8px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .summary-item.active { background: #ebf8ff; }
    .summary-item.done   { background: #f0fff4; }
    .summary-item.cancel { background: #fff5f5; }
    .summary-num { font-size: 2rem; font-weight: 800; line-height: 1; margin-bottom: 6px; }
    .summary-item.active .summary-num { color: #3182ce; }
    .summary-item.done .summary-num   { color: #38a169; }
    .summary-item.cancel .summary-num { color: #e53e3e; }
    .summary-lbl { font-size: 0.75rem; color: #718096; font-weight: 600; }

    /* 업무 부하 바 */
    .bar-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 11px; cursor: pointer;
      border-radius: 8px; padding: 3px;
      transition: background 0.15s;
    }
    .bar-row:hover { background: #f7fafc; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label { width: 58px; font-size: 0.84rem; font-weight: 600; color: #4a5568; flex-shrink: 0; }
    .bar-track { flex: 1; height: 10px; background: #edf2f7; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
    .bar-count { width: 32px; font-size: 0.8rem; font-weight: 600; text-align: right; flex-shrink: 0; }
    .bar-count.overload { color: #e53e3e; }
    .overload-badge {
      font-size: 0.68rem; background: #fed7d7; color: #c53030;
      border-radius: 99px; padding: 1px 7px; font-weight: 700; flex-shrink: 0;
    }

    /* 최근 지시 내역 */
    .log-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid #edf2f7; margin-bottom: 8px;
      background: white; font-size: 0.85rem;
    }
    .log-item:last-child { margin-bottom: 0; }
    .log-id { font-size: 0.72rem; color: #a0aec0; font-weight: 600; flex-shrink: 0; width: 72px; }
    .log-body { flex: 1; }
    .log-team { font-size: 0.72rem; font-weight: 700; margin-bottom: 2px; }
    .log-content { color: #2d3748; }
    .log-time { font-size: 0.7rem; color: #a0aec0; flex-shrink: 0; text-align: right; }

    /* 완료/취소 목록 */
    .done-section h3 {
      font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: #718096; margin-bottom: 12px;
    }
    .task-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      border: 1px solid #edf2f7; margin-bottom: 7px;
      opacity: 0.65;
    }
    .task-id { font-size: 0.72rem; color: #a0aec0; font-weight: 600; flex-shrink: 0; width: 72px; }
    .task-team {
      font-size: 0.72rem; font-weight: 700; flex-shrink: 0;
      border-radius: 99px; padding: 2px 8px;
    }
    .task-content { flex: 1; font-size: 0.85rem; text-decoration: line-through; color: #718096; }
    .task-date { font-size: 0.7rem; color: #a0aec0; flex-shrink: 0; }
    .task-status {
      font-size: 0.7rem; font-weight: 700; border-radius: 99px;
      padding: 2px 9px; flex-shrink: 0;
    }
    .status-완료 { background: #c6f6d5; color: #276749; }
    .status-취소 { background: #fed7d7; color: #9b2c2c; }

    /* 우선순위 */
    .priority { font-size: 0.7rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; flex-shrink: 0; }
    .priority-상 { background: #fed7d7; color: #c53030; }
    .priority-중 { background: #fefcbf; color: #b7791f; }
    .priority-하 { background: #c6f6d5; color: #276749; }

    /* 팀 색상 */
    .tc-총무     { color: #2b6cb0; background: #bee3f8; }
    .tc-상담     { color: #276749; background: #c6f6d5; }
    .tc-교육     { color: #c05621; background: #feebc8; }
    .tc-시설     { color: #553c9a; background: #e9d8fd; }
    .tc-리셉션   { color: #97266d; background: #fed7e2; }
    .tc-원장직접 { color: #3c366b; background: #e0e7ff; }

    /* 새로고침 버튼 */
    .refresh-btn {
      display: block; margin: 0 auto 12px;
      padding: 9px 24px; background: #667eea; color: white;
      border: none; border-radius: 99px; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .refresh-btn:hover { background: #5a67d8; }

    .loading { text-align: center; color: #a0aec0; padding: 30px; font-size: 0.9rem; }
    .empty-msg { text-align: center; color: #cbd5e0; padding: 20px; font-size: 0.85rem; }

    /* 팝업 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 20px; padding: 28px;
      width: 90%; max-width: 540px; max-height: 80vh;
      overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: popIn 0.2s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .modal-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 20px;
    }
    .modal-title { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 700; }
    .modal-close {
      background: #edf2f7; border: none; border-radius: 50%;
      width: 32px; height: 32px; font-size: 1rem; cursor: pointer; color: #718096;
    }
    .modal-close:hover { background: #e2e8f0; }
    .modal-task {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 13px; border-radius: 10px;
      border: 1px solid #edf2f7; margin-bottom: 8px; font-size: 0.87rem;
    }
    .modal-empty { text-align: center; color: #a0aec0; padding: 30px; }
  </style>
</head>
<body>

<!-- 팝업 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">
        <div id="modalDot" style="width:12px;height:12px;border-radius:50%;flex-shrink:0"></div>
        <span id="modalTeamName"></span>
        <span id="modalTeamCount" style="font-size:0.8rem;color:#a0aec0;font-weight:500"></span>
      </div>
      <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕</button>
    </div>
    <div id="modalTaskList"></div>
  </div>
</div>

<!-- 헤더 -->
<div class="header">
  <div>
    <h1>📋 KLC 업무 현황판</h1>
    <div class="subtitle">한국어전문학교 원장 업무 관리</div>
  </div>
  <div>
    <button class="refresh-btn" onclick="loadAll()">🔄 새로고침</button>
    <div class="last-updated" id="lastUpdated">—</div>
  </div>
</div>

<!-- 1행: 최우선 목표 + 전체 현황 요약 -->
<div class="grid-2" style="margin-bottom:20px">
  <div class="goal-card">
    <div class="goal-label">🎯 최우선 목표</div>
    <div id="goalContent"><div class="goal-empty">설정된 목표가 없습니다</div></div>
  </div>
  <div class="card" style="display:flex;flex-direction:column;justify-content:center">
    <div class="card-title">전체 현황 요약</div>
    <div class="summary-grid">
      <div class="summary-item active">
        <div class="summary-num" id="countActive">—</div>
        <div class="summary-lbl">진행중</div>
      </div>
      <div class="summary-item done">
        <div class="summary-num" id="countDone">—</div>
        <div class="summary-lbl">완료</div>
      </div>
      <div class="summary-item cancel">
        <div class="summary-num" id="countCancel">—</div>
        <div class="summary-lbl">취소</div>
      </div>
    </div>
  </div>
</div>

<!-- 2행: 업무 부하 + 최근 지시 내역 -->
<div class="grid-2" style="margin-bottom:20px">
  <div class="card">
    <div class="card-title">담당자별 업무 부하</div>
    <div id="barChart"><div class="loading">불러오는 중...</div></div>
  </div>
  <div class="card">
    <div class="card-title">최근 지시 내역 (최근 8건)</div>
    <div id="recentLog"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<!-- 3행: 완료 목록 + 취소 목록 -->
<div class="grid-2">
  <div class="card">
    <div class="card-title">✅ 완료 목록</div>
    <div id="doneList"><div class="loading">불러오는 중...</div></div>
  </div>
  <div class="card">
    <div class="card-title">🚫 취소 목록</div>
    <div id="cancelList"><div class="loading">불러오는 중...</div></div>
  </div>
</div>

<script>
  const SHEET_ID   = "1RsdKEMc6XaiF6axx0zD7ZIaKla_AcI7niRPbn2XgBmg";
  const SHEET_NAME = "업무현황";
  const GOAL_SHEET = "목표";

  const TEAM_COLORS = {
    "총무":     "#4299e1", "상담":     "#48bb78",
    "교육":     "#ed8936", "시설":     "#9f7aea",
    "리셉션":   "#f687b3", "원장직접": "#667eea",
  };
  const TEAM_ORDER = ["총무","상담","교육","시설","리셉션","원장직접"];
  const PRIORITY_LABEL = { "상": "🔴 중요!", "중": "🟡 보통", "하": "🟢 천천히" };

  let allTasks = [];

  // ── 데이터 로드 ──────────────────────────────────────────────
  async function fetchSheet(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
    const res  = await fetch(url);
    const text = await res.text();
    return JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  }

  async function loadAll() {
    try {
      await Promise.all([loadGoals(), loadTasks()]);
      document.getElementById("lastUpdated").textContent =
        "업데이트: " + new Date().toLocaleTimeString('ko-KR');
    } catch(e) { console.error(e); }
  }

  async function loadGoals() {
    try {
      const json = await fetchSheet(GOAL_SHEET);
      const rows = json.table.rows;
      const goals = rows.map(r => r.c[1]?.v ?? "").filter(v => String(v).trim());
      const el = document.getElementById("goalContent");
      if (goals.length) {
        el.innerHTML = goals.map((g, i) => `
          <div class="goal-item">
            <span class="goal-num">0${i+1}</span>
            <span class="goal-text">${g}</span>
          </div>`).join("");
      } else {
        el.innerHTML = '<div class="goal-empty">설정된 목표가 없습니다</div>';
      }
    } catch(e) {}
  }

  async function loadTasks() {
    const json = await fetchSheet(SHEET_NAME);
    const rows = json.table.rows;
    allTasks = rows.map(r => ({
      id:       r.c[0]?.v ?? "",
      date:     r.c[1]?.v ?? "",
      team:     r.c[2]?.v ?? "",
      content:  r.c[3]?.v ?? "",
      status:   r.c[4]?.v ?? "",
      doneAt:   r.c[5]?.v ?? "",
      memo:     r.c[6]?.v ?? "",
      priority: r.c[7]?.v ?? "",
    })).filter(t => t.team);

    renderSummary();
    renderBarChart();
    renderRecentLog();
    renderDoneCancel();
  }

  // ── 렌더링 ───────────────────────────────────────────────────
  function renderSummary() {
    document.getElementById("countActive").textContent = allTasks.filter(t => t.status === "진행중").length;
    document.getElementById("countDone").textContent   = allTasks.filter(t => t.status === "완료").length;
    document.getElementById("countCancel").textContent = allTasks.filter(t => t.status === "취소").length;
  }

  function renderBarChart() {
    const active = allTasks.filter(t => t.status === "진행중");
    const counts = {};
    TEAM_ORDER.forEach(t => counts[t] = 0);
    active.forEach(t => { if (counts[t.team] !== undefined) counts[t.team]++; });
    const max = Math.max(...Object.values(counts), 1);
    document.getElementById("barChart").innerHTML = TEAM_ORDER.map(team => {
      const n = counts[team], pct = Math.round((n/max)*100);
      const overload = n >= 5;
      const color = TEAM_COLORS[team] || "#a0aec0";
      return `<div class="bar-row" onclick="openTeamModal('${team}')" title="${team} 업무 보기">
        <div class="bar-label">${team}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="bar-count${overload?' overload':''}">${n}건</div>
        ${overload?'<span class="overload-badge">⚠️ 과부하</span>':''}
      </div>`;
    }).join("");
  }

  function renderRecentLog() {
    const recent = [...allTasks].reverse().slice(0, 8);
    if (!recent.length) {
      document.getElementById("recentLog").innerHTML = '<div class="empty-msg">지시 내역이 없습니다</div>';
      return;
    }
    document.getElementById("recentLog").innerHTML = recent.map(t => {
      const color = TEAM_COLORS[t.team] || "#a0aec0";
      const dateStr = t.date ? String(t.date).slice(0,16) : "";
      const p = t.priority ? `<span class="priority priority-${t.priority}">${PRIORITY_LABEL[t.priority]||t.priority}</span>` : "";
      return `<div class="log-item">
        <div class="log-id">${t.id}</div>
        <div class="log-body">
          <div class="log-team" style="color:${color}">${t.team}</div>
          <div class="log-content">${t.content}</div>
        </div>
        ${p}
        <div class="log-time">${dateStr.slice(5)}</div>
      </div>`;
    }).join("");
  }

  function renderDoneCancel() {
    const done   = allTasks.filter(t => t.status === "완료").reverse();
    const cancel = allTasks.filter(t => t.status === "취소").reverse();

    document.getElementById("doneList").innerHTML = done.length
      ? done.map(t => closedTaskHTML(t)).join("")
      : '<div class="empty-msg">완료된 업무가 없습니다</div>';

    document.getElementById("cancelList").innerHTML = cancel.length
      ? cancel.map(t => closedTaskHTML(t)).join("")
      : '<div class="empty-msg">취소된 업무가 없습니다</div>';
  }

  function closedTaskHTML(t) {
    const dateStr = t.doneAt ? String(t.doneAt).slice(0,16) : (t.date ? String(t.date).slice(0,16) : "");
    const p = t.priority ? `<span class="priority priority-${t.priority}">${PRIORITY_LABEL[t.priority]||t.priority}</span>` : "";
    return `<div class="task-item">
      <div class="task-id">${t.id}</div>
      <div class="task-team tc-${t.team}">${t.team}</div>
      <div class="task-content">${t.content}</div>
      ${p}
      <div class="task-date">${dateStr.slice(5)}</div>
      <div class="task-status status-${t.status}">${t.status}</div>
    </div>`;
  }

  // ── 팝업 ────────────────────────────────────────────────────
  function openTeamModal(team) {
    const color  = TEAM_COLORS[team] || "#a0aec0";
    const active = allTasks.filter(t => t.team === team && t.status === "진행중");
    const done   = allTasks.filter(t => t.team === team && t.status !== "진행중");
    document.getElementById("modalDot").style.background = color;
    document.getElementById("modalTeamName").textContent = team;
    document.getElementById("modalTeamCount").textContent = `${active.length}건 진행중`;
    let html = "";
    if (!active.length && !done.length) {
      html = '<div class="modal-empty">등록된 업무가 없습니다</div>';
    } else {
      html += active.map(t => modalTaskHTML(t)).join("");
      if (done.length) {
        html += `<div style="margin:14px 0 10px;font-size:0.75rem;font-weight:700;color:#a0aec0">완료 / 취소</div>`;
        html += done.map(t => modalTaskHTML(t, true)).join("");
      }
    }
    document.getElementById("modalTaskList").innerHTML = html;
    document.getElementById("modalOverlay").classList.add("open");
  }

  function modalTaskHTML(t, faded = false) {
    const p = t.priority ? `<span class="priority priority-${t.priority}">${PRIORITY_LABEL[t.priority]||t.priority}</span>` : "";
    return `<div class="modal-task" style="${faded?'opacity:0.5':''}">
      <div style="font-size:0.72rem;color:#a0aec0;font-weight:600;width:72px;flex-shrink:0">${t.id}</div>
      <div style="flex:1;font-size:0.87rem">${t.content}</div>
      ${p}
    </div>`;
  }

  function closeModal(e) {
    if (e.target === document.getElementById("modalOverlay"))
      document.getElementById("modalOverlay").classList.remove("open");
  }

  // 초기 실행 + 3분 자동 새로고침
  loadAll();
  setInterval(loadAll, 180000);
</script>
</body>
</html>
