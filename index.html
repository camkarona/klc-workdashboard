<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLC 업무 현황판</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px;
      color: #2d3748;
    }

    /* 헤더 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
    }
    .header .subtitle {
      font-size: 0.85rem;
      color: #718096;
      margin-top: 2px;
    }
    .last-updated {
      font-size: 0.8rem;
      color: #a0aec0;
      text-align: right;
    }

    /* 최우선 목표 */
    .goal-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 24px;
      color: white;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
    }
    .goal-icon { font-size: 2rem; }
    .goal-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      opacity: 0.85;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .goal-text {
      font-size: 1.2rem;
      font-weight: 700;
      min-height: 1.5rem;
    }
    .goal-text.empty { opacity: 0.5; font-weight: 400; font-style: italic; }

    /* 그리드 */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    /* 카드 공통 */
    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #718096;
      margin-bottom: 16px;
    }

    /* 업무 부하 바 */
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      width: 60px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #4a5568;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 10px;
      background: #edf2f7;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
    }
    .bar-count {
      width: 36px;
      font-size: 0.82rem;
      font-weight: 600;
      text-align: right;
      flex-shrink: 0;
    }
    .bar-count.overload { color: #e53e3e; }
    .overload-badge {
      font-size: 0.7rem;
      background: #fed7d7;
      color: #c53030;
      border-radius: 99px;
      padding: 1px 7px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* 팀 색상 */
    .color-총무     { background: #4299e1; }
    .color-상담     { background: #48bb78; }
    .color-교육     { background: #ed8936; }
    .color-시설     { background: #9f7aea; }
    .color-리셉션   { background: #f687b3; }
    .color-원장직접 { background: #667eea; }

    /* 요약 숫자 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .summary-item {
      text-align: center;
      padding: 14px 8px;
      border-radius: 12px;
    }
    .summary-item.active  { background: #ebf8ff; }
    .summary-item.done    { background: #f0fff4; }
    .summary-item.cancel  { background: #fff5f5; }
    .summary-num {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 4px;
    }
    .summary-item.active .summary-num  { color: #3182ce; }
    .summary-item.done .summary-num    { color: #38a169; }
    .summary-item.cancel .summary-num  { color: #e53e3e; }
    .summary-lbl { font-size: 0.75rem; color: #718096; font-weight: 600; }

    /* 업무 목록 */
    .task-section { margin-bottom: 20px; }
    .team-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .team-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .team-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #2d3748;
    }
    .team-count {
      font-size: 0.8rem;
      color: #a0aec0;
      font-weight: 500;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #edf2f7;
      margin-bottom: 8px;
      background: white;
      transition: box-shadow 0.15s;
    }
    .task-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .task-item.done { opacity: 0.5; }
    .task-id {
      font-size: 0.75rem;
      color: #a0aec0;
      font-weight: 600;
      width: 36px;
      flex-shrink: 0;
    }
    .task-content {
      flex: 1;
      font-size: 0.9rem;
      color: #2d3748;
    }
    .task-item.done .task-content { text-decoration: line-through; }
    .task-date {
      font-size: 0.75rem;
      color: #a0aec0;
      flex-shrink: 0;
    }
    .task-status {
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 10px;
      flex-shrink: 0;
    }
    .status-진행중 { background: #bee3f8; color: #2b6cb0; }
    .status-완료   { background: #c6f6d5; color: #276749; }
    .status-취소   { background: #fed7d7; color: #9b2c2c; }

    /* 새로고침 버튼 */
    .refresh-btn {
      display: block;
      margin: 0 auto 8px;
      padding: 10px 28px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background: #5a67d8; }

    .loading {
      text-align: center;
      color: #a0aec0;
      padding: 40px;
      font-size: 0.9rem;
    }
    .error-msg {
      text-align: center;
      color: #e53e3e;
      padding: 20px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>📋 KLC 업무 현황판</h1>
    <div class="subtitle">한국어전문학교 원장 업무 관리</div>
  </div>
  <div class="last-updated" id="lastUpdated">—</div>
</div>

<!-- 최우선 목표 -->
<div class="goal-card">
  <div class="goal-icon">🎯</div>
  <div>
    <div class="goal-label">최우선 목표</div>
    <div class="goal-text empty" id="goalText">설정된 목표가 없습니다</div>
  </div>
</div>

<!-- 업무 부하 + 요약 -->
<div class="grid">
  <div class="card">
    <div class="card-title">담당자별 업무 부하</div>
    <div id="barChart"><div class="loading">불러오는 중...</div></div>
  </div>
  <div class="card">
    <div class="card-title">전체 현황 요약</div>
    <div class="summary-grid">
      <div class="summary-item active">
        <div class="summary-num" id="countActive">—</div>
        <div class="summary-lbl">진행중</div>
      </div>
      <div class="summary-item done">
        <div class="summary-num" id="countDone">—</div>
        <div class="summary-lbl">완료</div>
      </div>
      <div class="summary-item cancel">
        <div class="summary-num" id="countCancel">—</div>
        <div class="summary-lbl">취소</div>
      </div>
    </div>
  </div>
</div>

<!-- 업무 목록 -->
<div class="card">
  <div class="card-title">업무 목록</div>
  <button class="refresh-btn" onclick="loadData()">🔄 새로고침</button>
  <div id="taskList"><div class="loading">불러오는 중...</div></div>
</div>

<script>
  // ── 설정 ──────────────────────────────────────────────────────
  const SHEET_ID = "1RsdKEMc6XaiF6axx0zD7ZIaKla_AcI7niRPbn2XgBmg";
  const SHEET_NAME = "업무현황";

  // 최우선 목표 — 직접 수정하세요
  const GOAL_TEXT = "";

  const TEAM_COLORS = {
    "총무":     "#4299e1",
    "상담":     "#48bb78",
    "교육":     "#ed8936",
    "시설":     "#9f7aea",
    "리셉션":   "#f687b3",
    "원장직접": "#667eea",
  };

  const TEAM_ORDER = ["총무","상담","교육","시설","리셉션","원장직접"];
  // ───────────────────────────────────────────────────────────────

  function setGoal() {
    const el = document.getElementById("goalText");
    if (GOAL_TEXT.trim()) {
      el.textContent = GOAL_TEXT;
      el.classList.remove("empty");
    }
  }

  async function loadData() {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;
    try {
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
      const rows = json.table.rows;

      const tasks = rows.map(r => ({
        id:      r.c[0]?.v ?? "",
        date:    r.c[1]?.v ?? "",
        team:    r.c[2]?.v ?? "",
        content: r.c[3]?.v ?? "",
        status:  r.c[4]?.v ?? "",
        doneAt:  r.c[5]?.v ?? "",
        memo:    r.c[6]?.v ?? "",
      })).filter(t => t.team);

      renderSummary(tasks);
      renderBarChart(tasks);
      renderTaskList(tasks);

      document.getElementById("lastUpdated").textContent =
        "업데이트: " + new Date().toLocaleTimeString('ko-KR');
    } catch (e) {
      document.getElementById("taskList").innerHTML =
        `<div class="error-msg">데이터를 불러올 수 없습니다.<br>스프레드시트 공유 설정을 확인해 주세요.<br><small>${e.message}</small></div>`;
    }
  }

  function renderSummary(tasks) {
    document.getElementById("countActive").textContent  = tasks.filter(t => t.status === "진행중").length;
    document.getElementById("countDone").textContent    = tasks.filter(t => t.status === "완료").length;
    document.getElementById("countCancel").textContent  = tasks.filter(t => t.status === "취소").length;
  }

  function renderBarChart(tasks) {
    const active = tasks.filter(t => t.status === "진행중");
    const counts = {};
    TEAM_ORDER.forEach(t => counts[t] = 0);
    active.forEach(t => { if (counts[t.team] !== undefined) counts[t.team]++; });

    const max = Math.max(...Object.values(counts), 1);
    const el = document.getElementById("barChart");
    el.innerHTML = TEAM_ORDER.map(team => {
      const n = counts[team];
      const pct = Math.round((n / max) * 100);
      const overload = n >= 5;
      const color = TEAM_COLORS[team] || "#a0aec0";
      return `
        <div class="bar-row">
          <div class="bar-label">${team}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>
          <div class="bar-count${overload ? ' overload' : ''}">${n}건</div>
          ${overload ? '<span class="overload-badge">⚠️ 과부하</span>' : ''}
        </div>`;
    }).join("");
  }

  function renderTaskList(tasks) {
    const active = tasks.filter(t => t.status === "진행중");
    const done   = tasks.filter(t => t.status !== "진행중");

    const el = document.getElementById("taskList");
    if (!tasks.length) { el.innerHTML = '<div class="loading">등록된 업무가 없습니다</div>'; return; }

    const byTeam = {};
    TEAM_ORDER.forEach(t => byTeam[t] = []);
    active.forEach(t => { if (byTeam[t.team]) byTeam[t.team].push(t); });

    let html = "";
    TEAM_ORDER.forEach(team => {
      const list = byTeam[team];
      if (!list.length) return;
      const color = TEAM_COLORS[team] || "#a0aec0";
      html += `
        <div class="task-section">
          <div class="team-header">
            <div class="team-dot" style="background:${color}"></div>
            <div class="team-name">${team}</div>
            <div class="team-count">${list.length}건 진행중</div>
          </div>
          ${list.map(t => taskHTML(t)).join("")}
        </div>`;
    });

    if (done.length) {
      html += `
        <div class="task-section" style="margin-top:20px">
          <div class="team-header">
            <div class="team-name" style="color:#a0aec0">완료 / 취소</div>
            <div class="team-count">${done.length}건</div>
          </div>
          ${done.map(t => taskHTML(t)).join("")}
        </div>`;
    }

    el.innerHTML = html;
  }

  function taskHTML(t) {
    const isDone = t.status !== "진행중";
    const dateStr = t.date ? String(t.date).slice(0, 16) : "";
    return `
      <div class="task-item${isDone ? ' done' : ''}">
        <div class="task-id">#${String(t.id).padStart(3,'0')}</div>
        <div class="task-content">${t.content}</div>
        <div class="task-date">${dateStr}</div>
        <div class="task-status status-${t.status}">${t.status}</div>
      </div>`;
  }

  // 초기 실행
  setGoal();
  loadData();
  // 3분마다 자동 새로고침
  setInterval(loadData, 180000);
</script>
</body>
</html>
